[package]
name = "salad"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.4.0", features = ["postgres", "chrono", "serde_json", "uuid"] }
diesel-async = { version = "0.10", features = ["postgres", "deadpool"] }
dotenvy = "0.15.7"
hex = "0.4.3"
rand = "0.10.4"
rustls = "0.23"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14.0"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["serde"] }
